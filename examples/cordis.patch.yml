# Example profile patch layer for DeepSeek Harness Web Tools.
#
# Copy to:  $DSH_HOME/profiles/<profile>/cordis.patch.yml
#           ($DSH_HOME defaults to ~/.dsh)
#
# Apply it to every profile you use -- `web` and `headless` are separate trees.
#
# This file is YOURS: `npm i -g @deepseek-ai/dsh` replaces the shipped bundles
# but never touches it. That is the whole point of putting the wiring here
# instead of editing files inside the dsh install.

# ── web capability seam ─────────────────────────────────────────────────────
#
# A patch REPLACES the targeted row's whole `config` rather than merging into
# it, so every field the seam needs is restated here -- including
# `searchProvider`, which would otherwise be lost when setting `fetchProvider`.
#
#   search -> `ddg-shim`, the local DuckDuckGo shim. Free, no API key.
#             The shipped default is `deepseek-official`, which bills against a
#             DeepSeek cloud key and cannot be served by a local model: it
#             speaks Anthropic `/messages` and relies on DeepSeek's
#             SERVER-SIDE web_search tool.
#   fetch  -> `http`. NOTE: DeepSeek ships fetch disabled on purpose --
#             dsh-web-fetch-http has no SSRF protection and the model chooses
#             the request target, so an agent can reach localhost, your LAN,
#             and any VPN/tailnet host. Enable it deliberately.
- id: web
  config:
    searchProvider: ddg-shim
    fetchProvider: http

- insert:
    # Plain HTTP fetch provider, published by DeepSeek.
    #
    # Install it per-profile:
    #   dsh plugin --profile web add @deepseek-ai/dsh-web-fetch-http
    #
    # Plugins resolve from the PROFILE directory. Putting it in the dsh
    # install's own node_modules instead makes EVERY profile crash on boot with
    # ERR_MODULE_NOT_FOUND -- including ones you never touched.
    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'

    # This repo's DuckDuckGo-backed search provider.
    #
    #   dsh plugin --profile web add /absolute/path/to/DeepSeek-Harness-Web-Tools/plugin
    #
    # `baseURL` must match wherever the shim listens.
    - id: web-search-ddg
      name: 'dsh-plugin-ddg-search'
      config:
        baseURL: http://127.0.0.1:8899

# Host-plane tool row. The per-preset copies are what the agent actually sees
# (see step 4 in the README); this keeps the two planes agreeing.
- id: tool-web
  config:
    fetch: true
    searchTimeoutMs: 60000
