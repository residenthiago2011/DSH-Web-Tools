# Example profile patch layer for DeepSeek Harness Web Tools (dsh 0.2.0-rc.1+).
#
# Add these rows to:  $DSH_HOME/profiles/<profile>/cordis.patch.yml
#                     ($DSH_HOME defaults to ~/.dsh)
#
# Do it for every profile you use -- `web` (browser UI), `desktop` (DeepSeek's
# desktop app) and `headless` are separate trees, each with its own patch file
# and its own node_modules.
#
# On 0.2 this file is ALL of your configuration (settings.yaml is gone), so
# APPEND these rows to what is already there; do not replace the file.
# `npm i -g @deepseek-ai/dsh` replaces the shipped bundles but never touches it.

# ── web capability seam ─────────────────────────────────────────────────────
#
# A patch REPLACES the targeted row's whole `config` rather than merging into
# it, so every field the seam needs is restated here -- including
# `fetchProvider`, which would otherwise be lost when setting `searchProvider`.
#
#   search -> `ddg-shim`, this repo's provider. The ID is historical; the
#             provider queries DuckDuckGo and Bing directly from the dsh
#             process, with no API key and no extra service.
#   fetch  -> `http`, the shipped value. 0.2's base bundle already installs
#             and inserts @deepseek-ai/dsh-web-fetch-http, which only fetches
#             public addresses. Nothing else to add for fetch.
- id: web
  config:
    searchProvider: ddg-shim
    fetchProvider: http

- insert:
    # This repo's keyless search provider. Install it per profile:
    #
    #   dsh plugin --profile web add link:/absolute/path/to/DSH-Web-Tools/plugin
    #
    # Plugins resolve from the PROFILE directory. Putting it in the dsh
    # install's own node_modules instead makes EVERY profile crash on boot with
    # ERR_MODULE_NOT_FOUND -- including ones you never touched.
    #
    # Package history: first published as "dsh-plugin-ddg-search"; since
    # 2026-11 the package is "@residenthiago/dsh-web-tools" (row id unchanged).
    - id: web-search-ddg
      name: '@residenthiago/dsh-web-tools'
      config:
        engine: auto
        maxResults: 8
        timeoutMs: 12000

# ── bundle install note ─────────────────────────────────────────────────────
# On dsh 0.2.1-rc.3+ the plugin package itself declares this row
# (dsh.bundle.patch → its own cordis.patch.yml), so the Plugins panel can
# manage it: pick it up under "Personal" ("Web Tools") and toggle it there.
# If the bundle is selected in profiles/web/package.json
# ({ "dsh": { "profile": { "bundles": ["@residenthiago/dsh-web-tools"] } } }),
# SKIP the `- insert:` block above -- the rows would conflict by id.

# No preset row is needed: 0.2's shipped `standard` preset already carries
#   - id: tool-web  (fetch: true, searchTimeoutMs: 60000)
# If you declare your own preset row, keep that tool-web row in it.
